# Construit le jeu (.exe et .apk) et le serveur, puis crée la release GitHub.
# Se déclenche tout seul quand publier.bat envoie un tag v0.x.y.
# Peut aussi être lancé à la main depuis l'onglet Actions > Release > Run workflow :
# cocher « creer_release » crée la release (et son tag) pour la version du fichier VERSION.
#
# Signature Android : ajouter dans Settings > Secrets and variables > Actions
#   ANDROID_KEYSTORE_BASE64   le fichier .keystore encodé en base64
#   ANDROID_KEYSTORE_ALIAS    l'alias de la clé
#   ANDROID_KEYSTORE_PASSWORD le mot de passe
# Sans ces secrets, l'apk est signé avec une clé temporaire différente à chaque
# release : il faudra désinstaller l'ancienne version avant d'installer la nouvelle.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      creer_release:
        description: "Créer la release (et le tag) pour la version du fichier VERSION"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  construire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et ses modèles d'export
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf templates *.zip *.tpz

      - name: Installer rcedit (icône et version du .exe)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine
          wget -q -O "$HOME/rcedit.exe" https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe

      - name: Configurer Godot (Android, rcedit)
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/windows/rcedit = "$HOME/rcedit.exe"
          export/windows/wine = "/usr/bin/wine"
          EOF

      - name: Clé de signature Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            alias="$KEYSTORE_ALIAS"; pass="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Pas de clé Android dans les secrets : clé temporaire utilisée."
            alias=craftclans; pass=temporaire
            keytool -genkeypair -keystore "$ks" -alias "$alias" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Craftclans" -noprompt
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$alias" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Importer le projet
        run: godot --headless --import || true

      - name: Exporter
        run: |
          mkdir -p build/windows build/serveur build/android
          godot --headless --export-release "Windows" build/windows/Craftclans.exe
          godot --headless --export-release "Serveur Windows" build/serveur/Craftclans-Serveur.exe
          godot --headless --export-release "Android" build/android/Craftclans.apk
          ls -la build/*
          test -f build/windows/Craftclans.exe
          test -f build/serveur/Craftclans-Serveur.exe
          test -f build/android/Craftclans.apk

      - name: Préparer les fichiers
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION_JEU=$v" >> "$GITHUB_ENV"
          mkdir -p sortie paquet-jeu paquet-serveur
          cp build/windows/Craftclans.exe distribution/jeu/LISEZMOI.txt paquet-jeu/
          cp build/serveur/Craftclans-Serveur.exe build/serveur/Craftclans-Serveur.console.exe distribution/serveur/* paquet-serveur/
          (cd paquet-jeu && zip -q -r "../sortie/Craftclans-Windows-v$v.zip" .)
          (cd paquet-serveur && zip -q -r "../sortie/Craftclans-Serveur-Windows-v$v.zip" .)
          cp build/android/Craftclans.apk "sortie/Craftclans-v$v.apk"
          git log -1 --pretty=%B > notes.md
          ls -la sortie

      - uses: actions/upload-artifact@v4
        with:
          name: craftclans-${{ env.VERSION_JEU }}
          path: sortie/*

      - name: Créer la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.creer_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_JEU }}
          target_commitish: ${{ github.sha }}
          name: Craftclans v${{ env.VERSION_JEU }}
          body_path: notes.md
          files: sortie/*
